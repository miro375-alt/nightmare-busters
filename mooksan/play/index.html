<script>
'use strict';
const cv=document.getElementById('cv'), cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
const VW=400, VH=304, T=16;

/* ══════════ 에셋 ══════════ */
const IMG={}; let ready=0;
[['tile','assets/tiles.png'],['char','assets/char.png'],['ui','assets/ui.png']]
  .forEach(([k,src])=>{ const i=new Image(); i.onload=()=>ready++; i.src=src; IMG[k]=i; });

// 아틀라스 좌표 [col,row]
const A={
  FLOOR:[[0,0],[1,0],[2,0],[3,0],[4,0]],
  WTOP:[5,0], WUP:[6,0], WAINT:[7,0], WAIN:[8,0], BASE:[9,0],
  DOOR:[[10,0],[11,0],[10,1],[11,1]], EXITD:[[12,0],[13,0],[12,1],[13,1]],
  PLATE:[14,0], SIGN:[15,0], HWIN:[[0,1],[1,1]],
  LIT:[2,1], UNLIT:[3,1],
  BBT:[[4,1],[5,1],[6,1],[7,1]], BBB:[[4,2],[5,2],[6,2],[7,2]],
  DESK:[8,1], TDL:[9,1], TDR:[9,2], LOCKT:[10,2], LOCKB:[11,2], RWIN:[12,2],
  PROP:{book:[0,3],tag:[1,3],case:[2,3],shoe:[3,3],bag:[4,3]},
  RFLOOR:[[5,3],[6,3]]
};
function tile(a,x,y){ cx.drawImage(IMG.tile,a[0]*T,a[1]*T,T,T,x|0,y|0,T,T); }

/* 9-슬라이스 창 (LimeZu Modern UI) */
function win9(x,y,w,h){
  const S=32,c=9,m=S-c*2;
  const d=(sx,sy,sw,sh,dx,dy,dw,dh)=>cx.drawImage(IMG.ui,sx,sy,sw,sh,dx|0,dy|0,dw|0,dh|0);
  d(0,0,c,c,x,y,c,c); d(S-c,0,c,c,x+w-c,y,c,c);
  d(0,S-c,c,c,x,y+h-c,c,c); d(S-c,S-c,c,c,x+w-c,y+h-c,c,c);
  for(let i=x+c;i<x+w-c;i+=m){ const ww=Math.min(m,x+w-c-i);
    d(c,0,ww,c,i,y,ww,c); d(c,S-c,ww,c,i,y+h-c,ww,c); }
  for(let j=y+c;j<y+h-c;j+=m){ const hh=Math.min(m,y+h-c-j);
    d(0,c,c,hh,x,j,c,hh); d(S-c,c,c,hh,x+w-c,j,c,hh); }
  for(let j=y+c;j<y+h-c;j+=m) for(let i=x+c;i<x+w-c;i+=m){
    const ww=Math.min(m,x+w-c-i), hh=Math.min(m,y+h-c-j); d(c,c,ww,hh,i,j,ww,hh); }
}
const INK='#3b3125', INK2='#6b5c46', GOLD='#8a5a1e';
function txt(s,x,y,col,size,al){
  cx.fillStyle=col||INK;
  cx.font=(size||11)+'px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  cx.textAlign=al||'left'; cx.textBaseline='top'; cx.fillText(s,x,y);
}

/* ══════════ 상태 ══════════ */
const DOORW=6, DOORS=6, SEAL=72*60;
const R={ top:2, plate:3, door:4, wain:6, base:7, f0:8, f1:12, sillT:13, win:14, bot:15 };
const RM={ x0:5, x1:19, y0:2, yBB:3, yBase:4, f0:5, f1:14, yDoor:15, cx:12 };

const S={
  scene:'title', map:'hall',
  wx:3, wy:10, dir:0, anim:0, mv:0, run:false,
  unit:0, noteUnit:null, drift:0, lastDoor:null,
  num:0, outMin:0, pages:14, room:0,
  found:{}, foundN:0,
  t:0, lastCall:-99, dead:false, won:false, _warned:0,
  msg:null, choice:null, numin:null
};
const era=u=>u>=9?1997:u>=6?2008:u>=3?2017:2026;
const ERA_LIT={2026:1.0,2017:0.72,2008:0.46,1997:0.16};
const SPOTS=['칠판','책상','사물함'];
const CLUE_TOTAL=12;

const CLUES={
 2026:{칠판:['9/17 (목) 　야자 2교시 20:40~21:30','아래에 청소 당번표가 붙어 있다.',
   '월 김██  화 박██  수 최██','목 (　　)  금 윤██','목요일 칸만 비어 있다.',
   '지운 게 아니다. 처음부터 안 썼다.'],
  책상:['내 자리다.','문제집이 펼쳐져 있다. 마지막으로 푼 건 3번.','볼펜은 굴러가서 바닥에 있다.',
   '4번부터는 손을 안 댔다.','나간 게 아니라 그냥 멈춘 자리다.'],
  사물함:['내 사물함이 열려 있다.','우산이 하나 들어 있다.','오늘은 비가 안 왔다.',
   '내일 온다고 했었다.']},
 2017:{칠판:['분필이 아니라 마커로 썼다.','「구역 재확인 요망」','「계측기 반납 ─ 미이행」',
   '「상주 3일차」','그 아래에 칸이 하나 그려져 있다.','「교대 인원 도착 시 기재할 것 ─ 」',
   '그 칸은 비어 있다.'],
  책상:['교탁 위에 서류가 한 장 놓여 있다.','■ 인 사 발 령','아래 인원에게 현장 상주 근무를 명함.',
   '기간 : 2017. 6. 12. ~ (　　　　)','인원 : 4명','※ 종료일은 상황 종료 후 기재한다.',
   '종료일란은 아직 공란이다.'],
  사물함:['대응반 장비함이다.','방독면 4개. 전부 미사용.','봉인 스티커가 뜯겨 있다.','……안쪽에서.',
   '장비를 쓰러 온 사람들이 아니었다.','넣어두러 온 사람들이었다.']},
 2008:{칠판:['필적이 두 개다.','「구조 완료. 이송 인원 확인 후 귀가 조치.」',
   '그 아래, 분필을 눕혀 급하게 쓴 글씨.','「─ 몇 명이었지」'],
  책상:['명단 사본이 놓여 있다.','01 김██ … 귀가 (인)','02 이██ … 귀가 (인)','03 박██ … 귀가 (인)',
   '…','1█ ██ 　… 귀가 (인)','확인란 서명 1█건이 전부 같은 필적이다.'],
  사물함:['신발장이다.','운동화 1█켤레. 크기가 전부 다르다.','실내화가 아니다.',
   '밖에서 신고 들어온 신발이다.','이 학교 학생이 아니었다.']},
 1997:{칠판:['날짜가 멈춰 있다.','「4 / 17 (목)」','그 아래 정(正)자 표시.',
   '正正正正正正正正正正正丁','스물둘까지 세다가 멈췄다.'],
  책상:['책상마다 이름표가 붙어 있다.','스물두 개.','하나만 비어 있다.','그 자리에……',
   '지금 내 가방이 놓여 있다.'],
  사물함:['사물함 안쪽에 긁힌 자국이 있다.','「사흘째. 배 안 고픔.」',
   '「물도 안 마셨는데 목 안 마름.」','「밖에서 소리가 남. 공사하는 소리 같음.」',
   '「누가 벽을 막고 있는 것 같음.」','봉인은 72시간 뒤였다.']}
};

/* ══════════ 입력 ══════════ */
const K={};
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',
  ArrowRight:'right',KeyD:'right',Space:'ok',Enter:'ok',KeyZ:'ok',KeyF:'ok',
  Escape:'cancel',KeyX:'cancel',KeyE:'note',ShiftLeft:'run',ShiftRight:'run'};
addEventListener('keydown',e=>{ const k=KM[e.code]; if(!k)return; e.preventDefault();
  if(e.repeat&&k!=='up'&&k!=='down'&&k!=='left'&&k!=='right')return; K[k]=1; press(k); });
addEventListener('keyup',e=>{ const k=KM[e.code]; if(k)K[k]=0; });
function press(k){
  if(S.scene!=='play')return;
  if(S.msg){ if(k==='ok'||k==='cancel')advMsg(); return; }
  if(S.numin){ numKey(k); return; }
  if(S.choice){ chKey(k); return; }
  if(k==='ok') interact();
  if(k==='note') note();
}

/* ══════════ 오디오 ══════════ */
let AC=null,humG=null;
function audioOn(){ try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(), f=AC.createBiquadFilter(); humG=AC.createGain();
  o.type='sawtooth'; o.frequency.value=60; f.type='lowpass'; f.frequency.value=190;
  humG.gain.value=0.022; o.connect(f); f.connect(humG); humG.connect(AC.destination); o.start();
}catch(e){} }
function blip(fr,dur,vol,ty){ if(!AC)return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=ty||'triangle'; o.frequency.value=fr; g.gain.value=vol||0.05;
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(dur||0.08));
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+(dur||0.08)+0.02); }
const stepSfx=()=>blip(94+Math.random()*26,0.06,0.038);
const tick=()=>blip(720,0.012,0.014,'square');

/* ══════════ 메시지 · 선택 · 수치입력 ══════════ */
function say(lines,after){ S.msg={lines:[].concat(lines),i:0,c:0,after:after||null}; }
function advMsg(){ const m=S.msg;
  if(m.c<m.lines[m.i].length){ m.c=m.lines[m.i].length; return; }
  m.i++; m.c=0;
  if(m.i>=m.lines.length){ const cb=m.after; S.msg=null; if(cb)cb(); } }
function drawMsg(){ const m=S.msg,h=62,y=VH-h-5;
  win9(5,y,VW-10,h);
  txt(m.lines[m.i].slice(0,Math.floor(m.c)),20,y+21,INK,12);
  const last=(m.i+1>=m.lines.length)&&(m.c>=m.lines[m.i].length);
  if(m.c>=m.lines[m.i].length && Math.sin(S.t*6)>0)
    txt(last?'■':'▼',VW-24,y+h-24,GOLD,10); }
function choose(title,opts,cb){ S.choice={title,opts,i:0,cb}; }
function chKey(k){ const c=S.choice;
  if(k==='up'){ c.i=(c.i+c.opts.length-1)%c.opts.length; tick(); }
  if(k==='down'){ c.i=(c.i+1)%c.opts.length; tick(); }
  if(k==='ok'){ const f=c.cb,i=c.i; S.choice=null; blip(520,0.06,0.05); f(i); }
  if(k==='cancel') S.choice=null; }
function drawChoice(){ const c=S.choice,w=210,h=26+c.opts.length*17,x=(VW-w)/2,y=VH-h-74;
  win9(x,y,w,h); txt(c.title,x+14,y+10,INK2,10);
  c.opts.forEach((o,i)=>{ const yy=y+26+i*17;
    if(i===c.i) txt('▶',x+12,yy,GOLD,11);
    txt(o,x+26,yy,i===c.i?INK:INK2,11); }); }
function askNumber(title,hint,cb){ S.numin={title,hint,d:[0,0],i:0,cb}; }
function numKey(k){ const n=S.numin;
  if(k==='left'){ n.i=(n.i+1)%2; tick(); }
  if(k==='right'){ n.i=(n.i+1)%2; tick(); }
  if(k==='up'){ n.d[n.i]=(n.d[n.i]+1)%10; tick(); }
  if(k==='down'){ n.d[n.i]=(n.d[n.i]+9)%10; tick(); }
  if(k==='ok'){ const f=n.cb,v=n.d[0]*10+n.d[1]; S.numin=null; blip(430,0.09,0.06); f(v); }
  if(k==='cancel') S.numin=null; }
function drawNum(){ const n=S.numin,w=216,h=96,x=(VW-w)/2,y=(VH-h)/2-20;
  win9(x,y,w,h);
  txt(n.title,x+16,y+13,INK,11); txt(n.hint,x+16,y+29,INK2,10);
  const dw=24,sx=x+(w-dw*2)/2;
  n.d.forEach((v,i)=>{ const bx=sx+i*dw,sel=i===n.i;
    cx.fillStyle=sel?'#c8b48a':'#b9a888'; cx.fillRect(bx,y+50,dw-5,24);
    cx.strokeStyle=sel?GOLD:'#8a7a5e'; cx.lineWidth=1; cx.strokeRect(bx+.5,y+50.5,dw-6,23);
    txt(String(v),bx+(dw-5)/2,y+56,INK,13,'center');
    if(sel){ txt('▲',bx+(dw-5)/2,y+41,GOLD,7,'center'); txt('▼',bx+(dw-5)/2,y+75,GOLD,7,'center'); } });
  txt('← → 자리　↑ ↓ 숫자　Space 기재',x+w/2,y+h-19,INK2,9,'center'); }

/* ══════════ 진행 ══════════ */
const doorAt=wx=> (((wx%DOORW)+DOORW)%DOORW===3)
  ? {k:Math.floor(wx/DOORW), n:((Math.floor(wx/DOORW)%DOORS)+DOORS)%DOORS+1} : null;
function note(){
  if(S.t-S.lastCall<6)return;
  if(S.pages<=0){ say(['수첩에 쓸 자리가 없다.']); return; }
  S.lastCall=S.t; S.pages--; S.noteUnit=S.unit; S.drift=0;
  S.num=Math.max(0,S.num-14); blip(230,0.08,0.06);
  say([S.unit+'단위. '+(S.map==='hall'?'복도. 문 여섯.':'3-'+S.room+' 안.'),
    S.pages===0?'……마지막 쪽이었다.':S.pages<=3?'세 쪽 남았다.':'적어뒀다.']); }
function onUnit(){
  const u=S.unit, ext=u<=3?u*6:18+Math.pow(u-3,2.35)*22;
  S.outMin=Math.max(S.outMin,Math.round(ext));
  if(S.outMin>=SEAL) sealed(); }

function blocked(x,y){
  if(S.map==='hall') return !(y>=R.f0 && y<=R.f1);
  if(x<=RM.x0||x>=RM.x1||y<RM.f0||y>RM.f1) return true;
  if(y===RM.f0 && x>=RM.cx-1 && x<=RM.cx) return true;          // 교탁
  return DESKS.some(p=>p[0]===x&&p[1]===y); }
function tryMove(d,run){
  const v=[[0,1],[-1,0],[1,0],[0,-1]][d]; S.dir=d;
  const nx=S.wx+v[0], ny=S.wy+v[1];
  if(blocked(nx,ny)) return false;
  if(S.map==='hall' && v[0]!==0){
    const to=doorAt(nx);
    if(to && to.k!==S.lastDoor){ S.lastDoor=to.k; S.drift+=v[0]; }
    const P=DOORW*DOORS, nb=Math.floor(nx/P), ob=Math.floor(S.wx/P);
    if(nb!==ob){
      if(v[0]>0) S.unit++;
      else if(run){ S.unit++; say(['뛰니까 문이 더 나온다.','……돌아가고 있는 게 맞나.']); }
      else S.unit=Math.max(0,S.unit-1);
      onUnit();
    }
  }
  S.wx=nx; S.wy=ny; S.mv=1; return true; }

function interact(){
  const v=[[0,1],[-1,0],[1,0],[0,-1]][S.dir];
  const fx=S.wx+v[0], fy=S.wy+v[1];
  if(S.map==='hall'){
    if(S.dir===3 && S.wy===R.f0){
      const d=doorAt(S.wx)||doorAt(S.wx-1);
      if(d){ d.n===DOORS?openExit():enterRoom(d.n); return; }
      say(['벽이다.','문 사이에는 아무것도 없다.']); return;
    }
    if(fy>R.f1) say(['창이다. 밖은 운동장.','조명이 켜져 있다.','이 시간에 켜져 있을 리가 없다.']);
    else if(fy<R.f0) say(['벽이다.']);
    else say(['바닥이다.','왁스 자국이 아까 그 자리에 그대로 있다.']);
    return;
  }
  const sp=spotAt(fx,fy);
  if(!sp){ say(['별것 없다.']); return; }
  if(sp==='exit'){ leaveRoom(); return; }
  const e=era(S.unit), key=e+'/'+SPOTS.indexOf(sp);
  if(!S.found[key]){ S.found[key]=1; S.foundN++; S.num=Math.max(0,S.num-8); }
  const L=CLUES[e][sp].slice();
  if(e!==2026) L.unshift('……'+e+'년.');
  say(L); }
function spotAt(x,y){
  if(y===RM.yBase && x>=RM.cx-2 && x<=RM.cx+1) return '칠판';
  if(y===RM.f0 && x>=RM.cx-1 && x<=RM.cx) return '책상';        // 교탁
  if(x===RM.x0 && y>=RM.f0+1 && y<=RM.f0+4) return '사물함';
  if(y===RM.yDoor && (x===RM.cx||x===RM.cx+1)) return 'exit';
  if(DESKS.some(p=>p[0]===x&&p[1]===y)) return '책상';
  return null; }
function enterRoom(n){
  S.map='room'; S.room=n; S.wx=RM.cx; S.wy=RM.f1; S.dir=3; S.mv=0; blip(150,0.13,0.06);
  say(['3-'+n+' 교실.', era(S.unit)===2026?'아까 나온 그 교실이다.':'……아까 그 교실이 아니다.']); }
function leaveRoom(){
  S.map='hall'; S.wy=R.f0; S.dir=0; S.mv=0; blip(128,0.12,0.05);
  if(S.num>50 && Math.random()<0.28){ S.unit++; onUnit();
    say(['복도로 나왔다.','……아까보다 문이 하나 더 있는 것 같다.','아니, 착각이겠지.']); } }

function openExit(){
  say(['비상구다. 잠겨 있지 않다.','옆에 관리 카드 판독기가 있다.',
    '「출입 시 현재 구역을 기재하십시오」','복도는 어느 단위나 똑같이 생겼다.',
    '적어둔 것 말고는 알 방법이 없다.'], ()=>{
    const o=['구역을 기재하고 연다','돌아선다'];
    if(S.foundN>=5) o.splice(1,0,'옆에 붙은 조사표를 본다');
    choose('비상구',o,i=>{
      if(i===0) askNumber('현재 구역 기재',
        S.noteUnit===null?'수첩 : 적어둔 것이 없다'
        :'수첩 '+S.noteUnit+'단위 · 지난 문 '+(S.drift>=0?'+':'')+S.drift, answerExit);
      else if(o[i]==='옆에 붙은 조사표를 본다') survey(); });
  }); }
function answerExit(a){
  if(a===S.unit){ escaped(); return; }
  const b=S.unit; S.unit=a; onUnit(); if(S.dead)return;
  say(['철문이 열렸다.', b<a?'……복도다. 아까보다 길다.':'……복도다. 아까 그 자리가 아니다.',
    '기재한 대로 처리되었다.']); }
function survey(){
  say(['■ 발생 구역 조사표','위험 등급 : 3급 (요주의)',
    '인　　원 : '+(S.foundN>=9?'2█명':'(　)명'),'생 존 자 : (　　　　　)','조치 의견 : 봉인',
    '※ 제8조에 따라 생존자 확인 절차는','　 두지 아니한다.'],
    ()=>choose('조사표',['생존자란에 내 이름을 적는다','그냥 둔다'],i=>{ if(i===0)filled(); })); }

/* ══════════ 종료 ══════════ */
function over(h,html){ S.scene='over'; S.msg=S.choice=S.numin=null;
  document.getElementById('oh').textContent=h;
  document.getElementById('or').innerHTML=html+
    '<span class="stat">조사 '+S.foundN+' / '+CLUE_TOTAL+' 　·　 도달 '+S.unit+
    '단위 　·　 밖에서 '+fmtOut(S.outMin)+' 　·　 수첩 '+S.pages+'쪽</span>';
  document.getElementById('over').style.display='flex'; }
function escaped(){ S.won=true; over('복도가 끝났다',
  '철문 너머는 2층 계단참이었다. 교무실 불이 켜져 있다.<br><br>'
 +'<b>정확히 적었기 때문에</b> 정확한 자리로 나왔다.<br>'
 +'<span class="dim">「기재한 대로 처리된다」 ─ 경고가 아니라 설명이었다.</span>'); }
function sealed(){ if(S.dead)return; S.dead=true; over('밖에서 사흘이 지났다',
  '복도는 그대로다. 아직 걸을 수 있다.<br><br>다만 밖에서는 <b>'+fmtOut(S.outMin)+'</b>이 지났다.<br>'
 +'<span class="dim">「발생 후 72시간이 경과한 경우 봉인한다.」<br>'
 +'「제7조에 따른 봉인 시 생존자 확인 절차는 두지 아니한다.」</span>'); }
function lose(m){ if(S.dead)return; S.dead=true; over('그 자리에 앉았다',m); }
function filled(){ S.dead=true; over('문이 열렸다',
  '이름을 적자마자 철문이 열렸다. 조사표가 완성되었기 때문이다.<br><br>'
 +'계단을 내려가 교문을 나섰다. 집에 갔다. 아무 일도 없었다.<br><br>'
 +'<span class="dim">다음 발생 구역 조사표의 <b>인원란이 한 명 늘어 있다.</b><br>'
 +'생존자란은 여전히 공란이다.</span>'); }
const fmtOut=m=>m<60?m+'분':Math.floor(m/60)+'시간 '+(m%60?m%60+'분':'');

/* ══════════ 교실 배치 ══════════ */
const DESKS=[]; (function(){ for(let r=0;r<3;r++) for(let c=0;c<5;c++)
  DESKS.push([RM.x0+3+c*2, RM.f0+3+r*3]); })();

/* ══════════ 그리기 ══════════ */
const warm=()=>S.num/100;
function drawHall(){
  const camX=(S.wx+ox())*T - VW/2 + T/2;
  cx.fillStyle='#07080b'; cx.fillRect(0,0,VW,VH);
  const x0=Math.floor(camX/T)-1, x1=x0+Math.ceil(VW/T)+2;
  for(let wx=x0;wx<=x1;wx++){
    const sx=wx*T-camX;
    // 천장
    for(let y=0;y<R.top;y++){ cx.fillStyle=y===R.top-1?'#1b1d24':'#101219';
      cx.fillRect(sx|0,y*T,T,T); }
    if(((wx%3)+3)%3===0){
      const fl=Math.sin(S.t*17+wx*2)>-0.9;
      cx.save(); cx.globalAlpha=fl?1:0.45; tile(fl?A.LIT:A.UNLIT, sx, (R.top-1)*T); cx.restore();
      if(fl){ cx.save(); cx.globalAlpha=0.07; cx.fillStyle='#f0f4dc';
        cx.fillRect(sx-8,R.f0*T,T*2,(R.f1-R.f0+1)*T); cx.restore(); }
    }
    tile(A.WTOP, sx, R.top*T);
    tile(A.WUP,  sx, R.plate*T);
    const d=doorAt(wx), dL=doorAt(wx-1);
    if(d){                                        // 문 왼쪽 절반
      const ex=(d.n===DOORS), set=ex?A.EXITD:A.DOOR;
      tile(ex?A.SIGN:A.PLATE, sx, R.plate*T);
      tile(set[0], sx, R.door*T); tile(set[2], sx, (R.door+1)*T);
    } else if(dL){                                // 문 오른쪽 절반
      const ex=(dL.n===DOORS), set=ex?A.EXITD:A.DOOR;
      tile(set[1], sx, R.door*T); tile(set[3], sx, (R.door+1)*T);
    } else { tile(A.WUP,sx,R.door*T); tile(A.WUP,sx,(R.door+1)*T); }
    tile(A.WAINT, sx, R.wain*T); tile(A.BASE, sx, R.base*T);
    for(let y=R.f0;y<=R.f1;y++){
      const vs=(((wx%3)+3)%3===0), hs=(y===R.f0||y===R.f1);
      let v = hs&&vs?3 : hs?1 : vs?2 : 0;
      if(!hs && !vs && ((wx*13+y*7)%29)===0) v=4;      // 드문 왁스 긁힘
      tile(A.FLOOR[v], sx, y*T);
    }
    tile(A.WAINT, sx, R.sillT*T);
    tile(A.HWIN[((wx%2)+2)%2], sx, R.win*T);
    tile(A.BASE, sx, R.bot*T);
    // 문패 글자
    if(d && d.n!==DOORS){
      txt('3-'+d.n, sx+T+1, R.plate*T+6, 'rgba(255,255,255,.35)', 9, 'center');
      txt('3-'+d.n, sx+T,   R.plate*T+5, '#2e2a1e', 9, 'center'); }
  }
  // 문 앞 안내
  const dn=doorAt(S.wx)||doorAt(S.wx-1);
  if(dn && S.wy===R.f0 && !S.msg && !S.choice && !S.numin && Math.sin(S.t*5)>-0.3)
    txt('▲', VW/2, (R.base)*T+4, '#e8c76a', 9, 'center');
  drawChar(VW/2-T/2, (S.wy+oy())*T-16);
}
const ROX=0, ROY=16;                        // 교실 화면 오프셋
function drawRoom(){
  const e=era(S.unit), LIT=ERA_LIT[e];
  cx.fillStyle='#05060a'; cx.fillRect(0,0,VW,VH);
  const TX=(x)=>x*T+ROX, TY=(y)=>y*T+ROY;

  // 바닥
  for(let y=RM.f0;y<=RM.f1;y++) for(let x=RM.x0;x<=RM.x1;x++)
    tile(A.RFLOOR[(x+y)%2], TX(x), TY(y));
  // 북벽 (천장 경계 → 벽면 2행 → 걸레받이)
  for(let x=RM.x0-1;x<=RM.x1+1;x++){
    cx.fillStyle='#0d0f15'; cx.fillRect(TX(x),TY(RM.y0-2),T,T);
    tile(A.WTOP, TX(x), TY(RM.y0-1));
    tile(A.WUP,  TX(x), TY(RM.y0));
    tile(A.WUP,  TX(x), TY(RM.yBB));
    tile(A.WAINT,TX(x), TY(RM.yBase));
  }
  // 좌우 벽
  for(let y=RM.f0;y<=RM.yDoor;y++){
    tile(A.WAIN, TX(RM.x0-1), TY(y)); tile(A.WAIN, TX(RM.x1+1), TY(y));
    tile(A.WAIN, TX(RM.x0),   TY(y)); tile(A.WAIN, TX(RM.x1),   TY(y));
  }
  // 남벽
  for(let x=RM.x0-1;x<=RM.x1+1;x++) tile(A.BASE, TX(x), TY(RM.yDoor));

  // 칠판
  for(let i=0;i<4;i++){
    tile(A.BBT[i], TX(RM.cx-2+i), TY(RM.yBB));
    tile(A.BBB[i], TX(RM.cx-2+i), TY(RM.yBase));
  }
  const BD={2026:'9/17 (목)  야자 2교시',2017:'상주 3일차 · 계측기 반납 ─',
            2008:'구조 완료. 이송 인원 확인',1997:'4 / 17 (목)'}[e];
  cx.save(); cx.globalAlpha=0.42+LIT*0.42;
  txt(BD,TX(RM.cx),TY(RM.yBB)+5,'#dfe6da',8,'center');
  if(e===1997) txt('正正正正正正正正正正正丁',TX(RM.cx),TY(RM.yBase)+2,'#cfd8c8',8,'center');
  cx.restore();

  // 교탁
  tile(A.TDL,TX(RM.cx-1),TY(RM.f0)); tile(A.TDR,TX(RM.cx),TY(RM.f0));
  // 사물함(서벽) · 창(동벽)
  for(let i=0;i<4;i++){
    tile(i===0?A.LOCKT:A.LOCKB, TX(RM.x0), TY(RM.f0+1+i));
    tile(A.RWIN,                TX(RM.x1), TY(RM.f0+1+i));
  }
  // 창 너머 운동장 불빛
  cx.save(); cx.globalAlpha=0.18+LIT*0.12;
  const g=cx.createLinearGradient(TX(RM.x1+1),0,TX(RM.x1-2),0);
  g.addColorStop(0,'rgba(255,238,196,.9)'); g.addColorStop(1,'rgba(255,238,196,0)');
  cx.fillStyle=g; cx.fillRect(TX(RM.x1-2),TY(RM.f0+1),T*3,T*4); cx.restore();

  // 형광등
  if(LIT>0.25){ const fl=(e===2017)?Math.sin(S.t*23)>-0.7:true;
    [[RM.cx-4,RM.f0+2],[RM.cx+3,RM.f0+2],[RM.cx-4,RM.f0+7],[RM.cx+3,RM.f0+7]]
      .forEach(([lx,ly])=>{
        cx.save(); cx.globalAlpha=fl?0.62:0.3; tile(fl?A.LIT:A.UNLIT, TX(lx), TY(ly)); cx.restore();
        if(fl){ cx.save(); cx.globalAlpha=0.07; cx.fillStyle='#f0f4dc';
          cx.fillRect(TX(lx)-10,TY(ly)-8,T*2+20,T*3); cx.restore(); } }); }

  // 책상 + 연대별 소품
  const sd=(a,b)=>Math.sin(a*7.3+b*3.1+S.unit*11.7)*0.5+0.5;
  DESKS.forEach((p,i)=>{
    const jx=(e===2008)?Math.round((sd(p[0],p[1])-0.5)*5):0;
    const jy=(e===2008)?Math.round((sd(p[1],p[0])-0.5)*4):0;
    tile(A.DESK, TX(p[0])+jx, TY(p[1])+jy);
    if(e===2026 && i===7)   tile(A.PROP.book, TX(p[0]), TY(p[1])-2);
    if(e===1997)            tile(A.PROP.tag,  TX(p[0]), TY(p[1])-2);
    if(e===1997 && i===8)   tile(A.PROP.bag,  TX(p[0]), TY(p[1])-4);
    if(e===2017 && i%5===2) tile(A.PROP.case, TX(p[0])+jx, TY(p[1])-2);
  });
  if(e===2008) for(let i=0;i<6;i++){ const s=sd(i,i*2+1);
    tile(A.PROP.shoe, TX(RM.x0+2+Math.round(s*10)), TY(RM.f0+2+Math.round(s*9))); }

  // 출입문
  tile(A.DOOR[2], TX(RM.cx), TY(RM.yDoor)); tile(A.DOOR[3], TX(RM.cx+1), TY(RM.yDoor));

  drawChar(TX(S.wx)+ox()*T, TY(S.wy)+oy()*T-16);

  // 조사 대상 표시
  const v=[[0,1],[-1,0],[1,0],[0,-1]][S.dir], sp=spotAt(S.wx+v[0],S.wy+v[1]);
  if(sp && !S.msg && !S.choice && Math.sin(S.t*5)>-0.3)
    txt(sp==='exit'?'▼':'!', TX(S.wx+v[0])+T/2, TY(S.wy+v[1])-4, '#e8c76a',10,'center');

  if(LIT<0.95){ cx.fillStyle='rgba(0,0,0,'+(0.40*(1-LIT))+')'; cx.fillRect(0,0,VW,VH); }
}
const ox=()=>{ if(!S.mv)return 0; const v=[[0,1],[-1,0],[1,0],[0,-1]][S.dir]; return -v[0]*S.mv; };
const oy=()=>{ if(!S.mv)return 0; const v=[[0,1],[-1,0],[1,0],[0,-1]][S.dir]; return -v[1]*S.mv; };
const DIRROW={0:0,3:1,1:2,2:3};      // 아래 / 위 / 왼 / 오른
function drawChar(x,y){
  cx.save(); cx.globalAlpha=0.28; cx.fillStyle='#000';
  cx.beginPath(); cx.ellipse((x|0)+8,(y|0)+30,6,2.4,0,0,7); cx.fill(); cx.restore();
  const f=S.mv?(1+Math.floor(S.anim)%5):0;
  const col=DIRROW[S.dir]*6+f;
  cx.drawImage(IMG.char, col*16,0,16,32, x|0,y|0,16,32);
}

/* ══════════ HUD ══════════ */
function drawHUD(){
  win9(4,4,132,50);
  txt('기록 이후',16,14,INK2,9);
  if(S.noteUnit===null){ txt('?',16,24,INK,15); txt('적어둔 것이 없다',34,29,INK2,9); }
  else { txt((S.drift>=0?'+':'')+S.drift,16,24,INK,15);
         txt(S.noteUnit+'단위에서 지난 문',40,29,INK2,9); }
  txt('E 기록',16,41,GOLD,9);
  txt('수첩 '+S.pages+'쪽',128,41,S.pages<=3?'#9c3d1e':INK2,9,'right');

  win9(VW-124,4,120,32);
  txt('무감각',VW-112,13,INK2,9);
  cx.fillStyle='#a2937a'; cx.fillRect(VW-112,25,96,5);
  cx.fillStyle=S.num>70?'#9c3d1e':S.num>40?'#b06b2a':'#5c7a52';
  cx.fillRect(VW-112,25,96*Math.min(1,S.num/100),5);
  if(S.outMin>0){ const hot=S.outMin>=SEAL*0.55;
    win9(VW-124,38,120,26);
    txt(hot?'봉인까지 '+fmtOut(SEAL-S.outMin):'외부 경과 '+fmtOut(S.outMin),
      VW-64,47,hot?'#9c3d1e':INK2,9,'center'); }
  txt('조사 '+S.foundN+' / '+CLUE_TOTAL, 8, VH-13, 'rgba(190,182,164,.55)',9);
}

/* ══════════ 루프 ══════════ */
let last=performance.now(), turnCd=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(S.scene==='play' && ready>=3){
    S.t+=dt;
    const busy=S.msg||S.choice||S.numin;
    S.run=!!K.run;
    if(S.mv>0){ S.mv-=dt*(S.run?11:6.4); S.anim+=dt*(S.run?17:10); if(S.mv<0)S.mv=0; }
    if(!busy && S.mv===0){
      let d=-1;
      if(K.up)d=3; else if(K.down)d=0; else if(K.left)d=1; else if(K.right)d=2;
      if(d>=0){
        if(S.dir!==d && turnCd<=0){ S.dir=d; turnCd=0.08; }
        else if(turnCd<=0){ if(tryMove(d,S.run)) stepSfx(); }
      } else S.anim=0;
      turnCd-=dt;
    }
    if(!busy){
      S.num+=dt*(1.1+(S.run&&S.mv?2.0:0)+Math.pow(S.unit,1.55)*0.09);
      if(S.num>=100) lose('언제부터 걷고 있었는지 기억나지 않는다. 아무렇지도 않았다.');
      const sc=S.t-S.lastCall;
      if(sc>15 && !S._warned && S.pages>0){ S._warned=1; say(['……뭘 하고 있었는지 잘 모르겠다.']); }
      if(sc<6) S._warned=0;
    }
    if(S.msg && S.msg.c<S.msg.lines[S.msg.i].length){
      S.msg.c+=dt*44; if(Math.random()<0.45)tick(); }
    if(AC&&humG) humG.gain.value=0.022*(1-S.num/125);
  }
  render(); requestAnimationFrame(loop);
}
function render(){
  if(ready<3){ cx.fillStyle='#07080b'; cx.fillRect(0,0,VW,VH);
    txt('불러오는 중…',VW/2,VH/2,'#4a4740',11,'center'); return; }
  if(S.scene==='title'){ cx.fillStyle='#07080b'; cx.fillRect(0,0,VW,VH); return; }
  const n=warm();
  if(S.map==='hall') drawHall(); else drawRoom();
  if(n>0.05){ cx.save(); cx.globalCompositeOperation='overlay'; cx.globalAlpha=n*0.55;
    cx.fillStyle='#c98a3a'; cx.fillRect(0,0,VW,VH); cx.restore(); }
  const vg=cx.createRadialGradient(VW/2,VH/2,VH*0.32,VW/2,VH/2,VH*1.0);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,'+(0.58-n*0.40)+')');
  cx.fillStyle=vg; cx.fillRect(0,0,VW,VH);
  drawHUD();
  if(S.numin) drawNum(); else if(S.choice) drawChoice(); else if(S.msg) drawMsg();
}

/* ══════════ 시작 ══════════ */
function reset(){
  Object.assign(S,{scene:'play',map:'hall',wx:3,wy:10,dir:2,anim:0,mv:0,
    unit:0,noteUnit:null,drift:0,lastDoor:null,num:0,outMin:0,pages:14,room:0,
    found:{},foundN:0,t:0,lastCall:-99,dead:false,won:false,_warned:0,
    msg:null,choice:null,numin:null});
  document.getElementById('over').style.display='none';
  say(['……복도 끝에 창이 있었는데.','문패가 3-1부터 다시 시작한다.',
    '여기가 몇 번째인지 알 방법이 없다.','（E 를 눌러 적어두자）']);
}
document.getElementById('go').onclick=()=>{
  document.getElementById('title').style.display='none'; audioOn(); reset(); };
document.getElementById('again').onclick=reset;
function fit(){ let s=Math.min(innerWidth/VW, innerHeight/VH);
  if(s>=1) s=Math.floor(s*2)/2;
  cv.style.width=(VW*s)+'px'; cv.style.height=(VH*s)+'px'; }
addEventListener('resize',fit); fit();
requestAnimationFrame(loop);
</script>
